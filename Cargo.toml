[package]
name = "typeset"
version = "1.1.0"
edition = "2021"
description = "Live LaTeX editor for macOS: Rust + AppKit + PDFKit, sandboxed Tectonic compiles"
license = "MIT"

[[bin]]
name = "typeset"
path = "src/main.rs"

[dependencies]
flate2 = "1"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-pdf-kit = "0.3"
objc2-uniform-type-identifiers = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
